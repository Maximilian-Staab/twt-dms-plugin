name: plugin-tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Plugin JavaScript tests
        run: node --test tests/*.test.mjs
      - name: Plugin QML syntax
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev-tools
          # Debian/Ubuntu ship qmllint in /usr/lib/qt6/bin and keep it off PATH.
          qmllint="$(command -v qmllint || echo /usr/lib/qt6/bin/qmllint)"
          test -x "$qmllint"
          # DMS (Theme, Proc, PluginSettings) and Quickshell modules only exist at
          # runtime inside a DMS session, so semantic warnings are expected here:
          # this step only fails when a file cannot be parsed. qmllint's warning
          # categories and the max-warnings flag differ across Qt releases, so
          # filter the JSON report instead of configuring levels.
          "$qmllint" --json qmllint.json TwtWidget.qml TwtSettings.qml TwtStartupCheck.qml || true
          python3 - <<'EOF'
          import json, sys
          report = json.load(open("qmllint.json"))
          errors = []
          for entry in report["files"]:
              for warning in entry["warnings"]:
                  # Qt 6.4/6.6: type "critical"; Qt 6.7+: id "syntax".
                  if warning.get("type") == "critical" or warning.get("id") == "syntax":
                      errors.append(f'{entry["filename"]}:{warning.get("line")}: {warning["message"]}')
          for error in errors:
              print(error, file=sys.stderr)
          if errors:
              sys.exit(f"{len(errors)} QML parse error(s)")
          EOF
      - name: Plugin Python tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate helper and manifest
        run: |
          python3 -m py_compile twt_auth.py
          python3 - <<'EOF'
          import json
          from pathlib import Path
          root = Path(".")
          manifest = json.loads((root / "plugin.json").read_text())
          for key in ("id", "name", "description", "version", "author", "type", "capabilities"):
              assert manifest.get(key), f"missing manifest field: {key}"
          for key in ("component", "settings", "startupCheck"):
              assert (root / manifest[key]).is_file(), f"missing {manifest[key]}"
          EOF
